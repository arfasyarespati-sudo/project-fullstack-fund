<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Latihan 4</title>
    <!-- Kode CSS yang diminta -->
    <style>
        @media screen and (max-width: 2000px) {
            blockquote {
                font-size: 40px;
                color: black;
            }
        }
        @media screen and (max-width: 800px) {
            blockquote {
                font-size: 30px;
                color: gray;
            }
        }
        @media screen and (max-width: 600px) {
            blockquote {
                font-size: 20px;
                color: lightgray;
            }
        }
    </style>
</head>
<body>
    <blockquote>
        I'd volunteer to go to prison, as long as there are books. Because with books I am free.
    </blockquote>
</body>
</html>
