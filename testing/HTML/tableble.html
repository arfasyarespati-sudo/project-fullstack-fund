<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Tabel Riwayat Pendidikan</title>
  <style>
    table {
      border-collapse: collapse;
      width: 60%;
      font-family: Arial, sans-serif;
      margin: 20px auto;
    }
    th, td {
      border: 2px solid #d26767;
      padding: 10px;
      text-align: center;
    }
    th {
      background-color: #f8eef5; 
      color: #333333d9;
    }
    tr:nth-child(even) td {
      background-color: #edd4e2; 
    }
    tr:nth-child(odd) td {
      background-color: #ffffffe3; 
    }
  </style>
</head>
<body>

<table>
  <tr>
    <th rowspan="2">No</th>
    <th rowspan="2">Nama Sekolah</th>
    <th colspan="2">Tahun</th>
  </tr>
  <tr>
    <th>Masuk</th>
    <th>Lulus</th>
  </tr>
  <tr>
    <td>1</td>
    <td>Nama TK</td>
    <td></td>
    <td></td>
  </tr>
  <tr>
    <td>2</td>
    <td>Nama SD</td>
    <td></td>
    <td></td>
  </tr>
  <tr>
    <td>3</td>
    <td>Nama SMP</td>
    <td></td>
    <td></td>
  </tr>
  <tr>
    <td>4</td>
    <td>Nama SMA</td>
    <td></td>
    <td></td>
  </tr>
  <tr>
    <td>5</td>
    <td>Nama Perguruan Tinggi</td>
    <td></td>
    <td></td>
  </tr>
</table>

</body>
</html>
